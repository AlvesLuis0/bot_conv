services:
  conversoes-bot:
    build: .
    image: conversoes-bot:latest
    container_name: conversoes-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - CONV_USERNAME=${CONV_USERNAME}
      - CONV_PASSWORD=${CONV_PASSWORD}
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
